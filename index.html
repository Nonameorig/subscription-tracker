<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sub Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="header-row">
    <h1 data-i18n="title">📊 Подписки</h1>
    <select id="langSwitch" class="lang-select">
      <option value="ru">RU</option>
      <option value="en">EN</option>
    </select>
  </div>

  <div class="card">
    <div class="form-grid">
      <div class="form-group full-width">
        <label data-i18n="label_name">Название сервиса</label>
        <input type="text" id="name" data-i18n-placeholder="placeholder_name" placeholder="Например, YouTube" autocomplete="off">
      </div>
      
      <div class="form-group">
        <label data-i18n="label_amount">Сумма</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" inputmode="decimal">
      </div>
      
      <div class="form-group">
        <label data-i18n="label_currency">Валюта</label>
        <select id="currency">
          <option value="USD">$ USD</option>
          <option value="EUR">€ EUR</option>
          <option value="RUB">₽ RUB</option>
          <option value="KZT">₸ KZT</option>
          <option value="BYN">Br BYN</option>
        </select>
      </div>

      <div class="form-group full-width">
        <label data-i18n="label_date">Дата платежа</label>
        <input type="date" id="date">
      </div>

      <div class="full-width" style="margin-top: 8px;">
        <button onclick="addSub()" data-i18n="btn_add">Добавить</button>
      </div>
    </div>
  </div>

  <div class="section-title" data-i18n="section_upcoming">Ближайшие оплаты</div>
  
  <div id="subList" class="sub-list"></div>
  <div id="emptyState" class="empty-state" style="display: none;" data-i18n="empty_text">
    У вас пока нет подписок.
  </div>

  <div id="totalsContainer" class="totals-container"></div>
</div>

<script src="script.js"></script>
</body>
</html>
